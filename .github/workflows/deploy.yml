name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: crpi-8ziiuyfb132t82h4.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: zhengjiao-app/start-page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REGISTRY,IMAGE,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -eu
            trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT

            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
              --username "$REGISTRY_USERNAME" --password-stdin
            docker pull "$IMAGE"

            OLD_IMAGE=$(docker inspect --format='{{.Image}}' start-page 2>/dev/null || true)
            docker rm -f start-page >/dev/null 2>&1 || true

            if ! docker run -d --name start-page --restart unless-stopped \
              -p 18080:80 "$IMAGE"; then
              if [ -n "$OLD_IMAGE" ]; then
                docker run -d --name start-page --restart unless-stopped \
                  -p 18080:80 "$OLD_IMAGE" || true
              fi
              exit 1
            fi

            attempt=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' start-page 2>/dev/null || true)" = "healthy" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 20 ]; then
                docker logs start-page || true
                docker rm -f start-page >/dev/null 2>&1 || true
                if [ -n "$OLD_IMAGE" ]; then
                  docker run -d --name start-page --restart unless-stopped \
                    -p 18080:80 "$OLD_IMAGE" || true
                fi
                exit 1
              fi
              sleep 3
            done

            docker image prune -f >/dev/null
